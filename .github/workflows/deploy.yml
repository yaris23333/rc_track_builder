name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 最小权限：读代码、写 Pages、用 OIDC 校验部署来源
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # GitHub Pages 项目站部署在 /<repo>/ 子路径，路由 basename 与资源 base 都要跟着走
      APP_BASE: /${{ github.event.repository.name }}/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # GitHub Pages 没有 SPA rewrite：把 index.html 复制成 404.html，
      # 直接访问 /s/<payload> 这类深链才能兜底到前端路由。
      - name: SPA fallback
        run: cp apps/web/build/client/index.html apps/web/build/client/404.html

      # ---- 发布闸门 ----
      # 未到发布阶段时下面两步跳过，流水线只做 CI（typecheck/test/build），提交记录保持绿色。
      # 正式发布：Settings → Pages 选 GitHub Actions，
      # 再在 Settings → Secrets and variables → Actions → Variables 新建 PAGES_READY=true。
      - name: Configure Pages
        if: vars.PAGES_READY == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        if: vars.PAGES_READY == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/build/client

  deploy:
    needs: build
    if: vars.PAGES_READY == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
